<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JobPilot Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>JobPilot Assistant</h1>
      <p id="sync-status">Checking candidate setup…</p>
      <button id="capture-linkedin" type="button">Capture visible LinkedIn jobs</button>
      <fieldset>
        <legend>Application mode</legend>
        <label><input type="radio" name="application-mode" value="review" checked /> Review before submit</label>
        <label><input type="radio" name="application-mode" value="auto" /> Auto-submit when safe</label>
      </fieldset>
      <button id="fill" type="button">Run assistant</button>
      <p class="warning">Auto-submit only runs after your explicit mode selection and stops for unresolved required questions, CAPTCHA, assessments, consent, declarations, file uploads, or an ambiguous submit control.</p>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
