name: Deploy static app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in {1..12}; do
            status=$(curl --silent --show-error --location --output /tmp/jobpilot.html --write-out '%{http_code}' "$PAGE_URL" || true)
            if [ "$status" = "200" ] && grep -q "ScaleUp JobPilot" /tmp/jobpilot.html; then
              echo "Live verification passed: $PAGE_URL returned HTTP 200 with the expected application marker."
              exit 0
            fi
            echo "Attempt $attempt/12: status=$status; waiting for Pages propagation."
            sleep 10
          done
          echo "Live verification failed for $PAGE_URL"
          exit 1
